# Every default in one place.
#
# This file *is* the defaults: `ar2l/config.py` reads it at import, the
# argparsers of `ar2l.train` and `ar2l.evaluate` take their defaults from it,
# and the values that have no flag at all (the PPO clip, the pointer
# temperature, the packed-item capacity) are read from it directly.  Editing a
# value here changes it everywhere, and a flag on the command line still wins
# over the file.
#
# Point at a different file with `--config other.yaml` or `AR2L_CONFIG=...`.
# RUN.md documents what each of these means.

env:
  # A 60 x 50 x 80 cm pallet modelled on a 2 cm grid.  The list form matters:
  # a "30x25x40" string is only parsed by the argparsers, so anything that
  # reads CFG directly -- BPPBatch, and therefore the whole `ar2l.evaluate`
  # CLI, which has no --bin flag -- would choke on it.
  bin: [31, 27, 40]
  n_items: 120           # items per episode; episodes end by infeasibility ~40
  size_lo: 4             # 8 cm, the smallest carton; item side bounds
  size_hi: [15, 10, 10]  # 30 x 20 x 20 cm
  max_l: 256             # candidate-list cap (leaf nodes); ~32 are used at p90
  max_c: 128             # initial packed-item capacity; it grows if exceeded
  rot: 2                 # 1 = no rotation, 2 = also yawed 90 degrees
  ems: 3                 # 0 = every position, 1 = EMS corners, 2 = corner cells, 3 = 1|2
  stability: com         # com = centre of mass over support, cdrl = 60%/4 corners
  # Contact-area floor.  0.70 on this problem leaves a median of 4 legal
  # placements and caps DBL at 18% utilisation; 0.30 costs ~2 points against
  # the bare centre-of-mass rule and leaves the action space intact.
  min_support: 0.80

  # ---- box types ---------------------------------------------------------
  # Every box carries a type_id, and a box may only be stacked on a box of its
  # own type -- type_rule below says what exceptions there are; the bin floor
  # takes any type.  Only the cells an item actually rests on are tested, so
  # an overhang that bridges a foreign type is legal and a contact patch on
  # one is not.
  n_types: 3
  type_constraint: 1     # 0 keeps type_id in the state but drops the rule
  # What "stacked on" means for that rule.  touch: only the cells a box rests
  # on are tested (above).  column: a box may not be anywhere over a foreign
  # type -- any box under any cell of its footprint counts, however deep and
  # across any gap, so the overhang that touch allows is blocked too.
  # mixed_touch / mixed_column: the cell's rules for blue (type 0), white (1)
  # and brown (2), with "on" read as touch / as column reads it.  A box goes
  # on the floor and its own type -- blue on blue with all of its base on
  # blue -- and across types:
  #                    normally          else          else, soft_mix: 1
  #   blue on white    (a)               fallback      last resort
  #   blue on brown    (a)               fallback      last resort
  #   white on blue    (a) or (d)        fallback      last resort
  #   white on brown   (a)               fallback      last resort
  #   brown on blue    (a), (c) or (d)   fallback      last resort, and no (c)
  #   brown on white   never             never         never
  # (a) its top ends within mixed_top_gap_cm of the pallet height; (c) its
  # footprint at least mixed_area_frac of the small blue's; (d) no small blue
  # box (mixed_small_blue_cm) could still go on that blue -- no height left
  # under the lid, the arm cannot put one there, or (column) a box covers it.
  # A fallback is a box's own: when that box has no normal place at all;
  # blue on blue with less than all of its base is one, soft mix or not.
  # Either way it only drops candidate placements; the reward is not touched.
  type_rule: mixed_column       # touch | column | mixed_touch | mixed_column
  # Soft mix, read by the mixed rules only: 1 trades a box's own fallback
  # onto another type for the station's last resort -- only when no box
  # within reach (n_pick) has any other place -- and gives brown on blue one
  # too, without (c).  Brown still never goes on white.
  soft_mix: 1
  # Outline step, read by the mixed rules only: 1 adds one more step when
  # all of the above leave nothing -- the same rules again (normal, then the
  # box's own fallback, then soft mix's last resort) over every position that
  # puts a corner of the box on an outline: the edges of every packed box --
  # its top outline (flush on it) and bottom outline (flush beside it) -- and
  # the pallet's edges, every cell along them, on top of the `ems` candidates.
  # outline_when: station -- only when no box within reach has any place by
  # the steps before; box -- for each box that has none, whatever the rest.
  # Nothing to add with `ems: 0`, where every position is a candidate already.
  outline_resort: 0
  outline_when: station         # station | box
  # The mixed rules' numbers, in real cm read onto the grid with the arm
  # filter's cell size (4 cm with the shipped eval.cell_cm * eval.box_scale).
  # The gap is rounded down to whole cells (5 cm -> 1 cell); the small blue
  # box is padded by eval.box_pad_m and rounded by eval.box_round like a box
  # of the data (50 x 30 x 18 cm -> 13 x 8 x 4 cells).
  mixed_top_gap_cm: 5
  mixed_area_frac: 0.8
  mixed_small_blue_cm: [50, 30, 18]
  # Robot-arm filter: 1 drops every candidate placement the UR20 cannot make
  # without one of its links hitting the pack, or cannot reach at all (the
  # IK/capsule check of ar2l/pack_collision.py, set up from `robot:` below).
  # All candidates are checked in one batch: ~25 ms per step for 64 bins.
  arm_collision: 1
  # One item-size class per type -- the type *is* the SKU.  `p` is that type's
  # share of the stream (the shares are normalised), `lo`/`hi` its per-axis
  # side bounds; together they have to stay inside `size_lo`/`size_hi`, which
  # the env recomputes from them as the envelope the sweeps are sized for.
  # `types: null` draws every type from size_lo/size_hi instead, which with
  # `n_types: 1` is the pre-type simulator exactly.
  types:
    - {p: 1, lo: [12, 7, 6], hi: [12, 7, 7]}  
    - {p: 1, lo: [12, 7, 6], hi: [12, 7, 7]}   
    - {p: 1, lo: [2, 2, 2], hi: [12, 12, 10]} 

  # ---- stack height over small boxes --------------------------------------
  # A small box carries only a short stack.  Once a box of one of
  # `stack_cap_types` is placed, a later box may *start* over its footprint
  # only below its top plus an allowance set by its shorter footprint side:
  # linear from stack_cap_allow_cm[0] at a side of stack_cap_side_cm[0] (and
  # below) to stack_cap_allow_cm[1] at stack_cap_side_cm[1], and no limit from
  # that side up.  With the values here: 12 cm -> 8 cm (one box on top),
  # 16 -> 36, 20 -> 64, 24 -> 96, 28 -> 124, 30 cm and wider -> none.  The
  # limit stays with the small box's cells: a box bridging it and a neighbour
  # is limited only over the small box.  Placements that break it are dropped
  # from the candidate list, like the type and arm rules; the reward is not
  # touched.  Real cm, read onto the grid with the arm filter's cell size
  # (robot.cell_m, else eval.cell_cm * eval.box_scale).  It is the cell's C++
  # stable_grid rule, without the C++ padding.
  stack_cap: 1
  stack_cap_types: [2]          # brown
  stack_cap_side_cm: [12, 30]
  stack_cap_allow_cm: [8, 140]

train:
  algo: select               # pct|cppo|rarl|rfmdp|exact|approx|attack
  nb: 10                  # observable items N_B
  n_pick: 5               # of the N_B, how many are within reach; the rest
                          # are preview only.  null = all of them.
  iters: 8000             # PPO iterations
  n_env: 64               # parallel bins
  T: 30                   # rollout length
  alpha: 1.0              # robustness weight (exact, approx)
  rho: 0.1                # TV uncertainty radius (approx, rfmdp)
  dist_coef: 1.0          # mixture-model distance loss weight (exact)
  cvar_q: 0.5             # CVaR level (cppo)
  # Where training episodes come from.  null (or "") is the random generator:
  # boxes drawn from the `types:` size classes above.  A path -- an orders
  # .csv (read with eval's cell_cm / pallet_cm / box_scale; pallet_cm, when
  # set, is also the bin trained on) or an instance .npy -- makes every
  # episode one of its pallets, drawn at random.
  data: data/orders_all.csv
  # With `data`: the share of its pallets kept out of training and used for
  # the held-out evals that select best.pt.  0 scores on the training pallets.
  holdout: 0.2
  # With `data`: randomise each drawn pallet's box order, as eval.order_random
  # does -- 0 keeps the file's order, 1 is fully random.  More variety from
  # the same pallets.
  order_random: 0.1

ppo:
  lr: 3.0e-4
  gamma: 1.0              # undiscounted, as in the paper
  lam: 0.95               # GAE lambda
  epochs: 4               # passes over each rollout
  minibatches: 4
  ent_coef: 0.01          # entropy bonus
  ent_final: null         # anneal the attacker's bonus to this; null = no anneal
  clip: 0.2               # PPO ratio clip
  vf_coef: 0.5            # value loss weight
  max_grad: 0.5           # gradient-norm clip

model:
  # The paper's 65k-parameter transformer.  Grid resolution does not drive
  # capacity here: the candidate list runs to 32 nodes at p90 and the packed
  # list to ~40, both far short of max_l, so 128/4/2 buys sequence capacity
  # that is never used and costs ~3x the GPU time per iteration.
  width: 128
  heads: 1
  layers: 1              # attention blocks
  c_temp: 10.0            # pointer-head temperature c in Eq. 28
  # Width of the trainable type embedding concatenated onto every node's
  # physical features before the per-element projection.  The embedding table
  # has n_types + 1 rows: one per box type, plus the bin floor, which is what
  # a candidate resting on nothing reports.
  type_embed: 16

run:
  seed: 0
  device: cuda            # cpu works, slowly; there is no silent fallback
  compile: 0              # torch.compile; miscompiles the pointer head
  eval_every: 250         # iterations between held-out evals; they select best.pt
  eval_inst: 512          # instances per held-out eval
  log_every: 50
  save_every: 250
  progress: auto          # auto|on|off, the stderr progress bar

eval:
  data: data/pallet_2cm_test.npy   # must match env.bin and the size bounds
  n_inst: 3000            # held-out instances scored
  batch: 256              # bins stepped at once
  beta: [0, 25, 50, 75, 100]   # percent of instances the attacker reorders
  seed: 0                 # which instances each beta subset picks
  # Real orders (`--data orders.csv`, see ar2l/orders.py) are in cm.  Their
  # boxes are rounded to `cell_cm` cells by `box_round`, and they are packed
  # onto a pallet of `pallet_cm` [length, width, height], rounded down to
  # cells; null packs them onto `env.bin` instead.
  cell_cm: 1.0
  # up: a box is never modelled smaller than it is (1.1 -> 2 cells).
  # down: never bigger (1.9 -> 1); a packing can then be slightly too tight
  # for the real boxes.  nearest: 1.5 -> 1, 1.51 -> 2.  Never below 1 cell.
  box_round: nearest
  pallet_cm: [31,27,40]
  # Divide every box side (x, y and z alike) by this before gridding: 0 (or 1)
  # keeps the sizes in the file, 2 halves them, 3 takes a third, and so on.
  # The pallet is not scaled.
  box_scale: 4
  # Metres added to every box's length and width (x and y, not z) before
  # box_scale -- the cell's C++ `padding`, added once per side, not per face:
  # 0.04 makes a 30 x 20 cm box 34 x 24 cm.  0 leaves the boxes as they are.
  box_pad_m: 0.04
  # How much the box arrival order is randomised before scoring, 0..1: 0 is
  # the order in the data, 1 a uniformly random order, and in between each
  # box drifts from its place -- by about r / (1 - r) of the pallet, so 0.1
  # moves a box ~5 places in a 50-box pallet.  `order_seed` fixes the draw.
  order_random: 0.1
  order_seed: 0

robot:
  # The UR20 drawn over the game's 3D bin, and the reach check it runs
  # (ar2l/pack_collision.py, a port of the cell's C++).
  # Robot base -> box origin, as the cell's tmp_base_from_box: x, y, z in
  # metres, then the quaternion qx, qy, qz, qw.
  base_from_box_tf: [-0.50777000000000005, 1.5415239999999999, -1, 0, 0, -0.70753916586098198, 0.70666309052477838]
  # Where the base may slide along its own x axis (the pallet's y) when the
  # arm cannot make a placement from where it stands, tried in this order
  # until one works; a placement is dropped only when every one fails.  Each
  # value is -1..1 of half the pallet's y side from `base_from_box_tf`:
  # 0 is that tf (the pallet's middle), -1 the base at pallet y = 0, 1 at
  # pallet y = its full side.  The move is for that one placement only, and
  # the policy never sees it.  [0] keeps the base fixed.
  base_x_moves: [0, -0.5, 0.5, -1, 1]
  # Flange to the tool's contact face, metres -- KinematicData::tool_length.
  # A placeholder until the real gripper is measured.
  tool_length_m: 0.35
  # Metres per grid cell.  null derives it from the game's grid:
  # eval.cell_cm * eval.box_scale / 100, i.e. the real size a scaled-down
  # cell stands for (1 cm * 4 = 4 cm with the shipped values).
  cell_m: null
  ik_solution: 1          # the lazy IK branch the cell runs
