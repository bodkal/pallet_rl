<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-BPP training</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a7;
      --c0:#4cc9f0;--c1:#f7b32b;--c2:#57cc99;--c3:#ef476f;--c4:#b892ff;--c5:#ff9770;}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--fg:#1a1d23;--dim:#6b7280;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;font-size:12px}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#kpis{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:118px}
.kpi .v{font-size:20px;font-weight:640;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;padding:14px 20px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px}
.card h2{font-size:12px;margin:0 0 6px;font-weight:600;color:var(--dim);letter-spacing:.3px}
svg{width:100%;height:170px;display:block;overflow:visible}
#prog{padding:10px 20px 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c0),var(--c2));
       border-radius:99px;transition:width .6s ease}
.prow{margin-bottom:9px}
.prow:last-child{margin-bottom:0}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:5px 0 0}
.barlab b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
#queue{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0;font-size:11px}
.q{border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--dim)}
.q.done{border-color:var(--c2);color:var(--c2)}
.q.running{border-color:var(--c0);color:var(--c0);font-weight:600}
.eta{font-size:20px;font-weight:640;font-variant-numeric:tabular-nums}
.card{cursor:zoom-in;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c0)}
#modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,#000);
  backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:26px}
#modal[hidden]{display:none}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(1180px,96vw);max-height:94vh;overflow:auto;padding:18px 22px 20px;
  box-shadow:0 24px 70px rgba(0,0,0,.45)}
#mhead{display:flex;align-items:baseline;gap:14px;margin-bottom:2px}
#mtitle{font-size:24px;font-weight:660;margin:0;letter-spacing:-.2px}
#mclose{margin-left:auto;border:1px solid var(--line);background:none;color:var(--dim);
  border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
#mclose:hover{color:var(--fg);border-color:var(--fg)}
#msvg{height:min(62vh,600px)!important;cursor:crosshair}
#mlg{font-size:15px!important;gap:18px!important;padding:6px 0 10px!important}
#mlg i{width:15px!important;height:4px!important;margin-right:7px!important}
#mhint{color:var(--dim);font-size:13px;margin-top:10px;opacity:.8}
#mread{font-size:16px;color:var(--dim);min-height:24px;padding-top:6px;
  font-variant-numeric:tabular-nums}
#mread b{color:var(--fg)}
.ax{stroke:var(--line);stroke-width:1}
.tk{fill:var(--dim)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--dim);padding:2px 0 4px}
.lg i{width:9px;height:2.5px;display:inline-block;vertical-align:middle;margin-right:4px}
</style>
<header>
  <h1>Online 3D-BPP &mdash; constrained DRL</h1>
  <span class="sub" id="status">connecting…</span>
  <span style="flex:1"></span>
  <span id="runsel"></span>
</header>
<div id="prog"></div>
<div id="queue"></div>
<div id="kpis"></div>
<div id="grid"></div>
<div id="modal" hidden onclick="if(event.target===this)closeM()">
  <div id="mbox">
    <div id="mhead"><h2 id="mtitle"></h2>
      <button id="mclose" onclick="closeM()">close &nbsp;esc</button></div>
    <div class="lg" id="mlg"></div>
    <svg id="msvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mread"></div>
    <div id="mhint">&larr; &rarr; to move between plots &nbsp;·&nbsp; hover to read values
      &nbsp;·&nbsp; esc or click outside to close &nbsp;·&nbsp; updates live</div>
  </div>
</div>
<script>
const COLORS=['--c0','--c1','--c2','--c3','--c4','--c5'];
const CHARTS=[
 {t:'Space utilisation',    k:['space_util'],           fmt:p, band:'space_util_std'},
 {t:'Items packed / bin',   k:['n_items'],              fmt:f2},
 {t:'Invalid-action rate',  k:['invalid_rate','mask_fpr'], fmt:p3, log:true},
 {t:'Mask predictor',       k:['mask_acc','mask_rec'],  fmt:p3},
 {t:'Episode end reason',   k:['frac_seq_end','frac_no_feasible','frac_invalid_end'], fmt:p},
 {t:'Actor loss',           k:['actor'],                fmt:f4},
 {t:'Critic loss',          k:['critic'],               fmt:f4},
 {t:'Mask loss (MSE)',      k:['mask'],                 fmt:f4},
 {t:'Feasibility entropy',  k:['entropy'],              fmt:f3},
 {t:'E_inf (infeasible prob mass)', k:['einf'],         fmt:f4, log:true},
 {t:'Approx KL / clip frac',k:['approx_kl','clipfrac'], fmt:f4},
 {t:'Throughput (FPS)',     k:['fps'],                  fmt:f0},
];
function p(v){return (100*v).toFixed(1)+'%'} function p3(v){return (100*v).toFixed(2)+'%'}
function f0(v){return v.toFixed(0)} function f2(v){return v.toFixed(2)}
function f3(v){return v.toFixed(3)} function f4(v){return v.toFixed(4)}
let RUNS=[], SEL=[], DATA={}, CFG={}, QUEUE=[];
function hms(h){ if(!isFinite(h)||h<0) return '--';
  const m=Math.round(h*60); if(m<60) return m+' min';
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' m'; }
// instantaneous rate from the tail of the log, not the lifetime average
function rate(d,n){ n=Math.min(n||25,d.length-1); if(n<1) return 0;
  const a=d[d.length-1-n], b=d[d.length-1];
  const dt=b.time-a.time; return dt>0 ? (b.step-a.step)/dt : 0; }

async function boot(){
  RUNS=await (await fetch('runs')).json();
  if(!SEL.length){const q=new URLSearchParams(location.search).get('runs');
    SEL = q? q.split(',') : (RUNS.length?[RUNS[0]]:[]);}
  document.getElementById('runsel').innerHTML=RUNS.map(r=>
    `<span class="pill ${SEL.includes(r)?'on':''}" onclick="tog('${r}')">${r}</span>`).join(' ');
  await tick(); setInterval(tick,4000);
  const o=new URLSearchParams(location.search).get('open');
  if(o!==null && MODAL===null) openM(Math.max(0,Math.min(CHARTS.length-1,+o)));
}
function tog(r){SEL.includes(r)?SEL=SEL.filter(x=>x!==r):SEL.push(r);
  if(!SEL.length)SEL=[r]; history.replaceState(0,'','?runs='+SEL.join(','));boot()}
async function tick(){
  for(const r of SEL){
    DATA[r]=await (await fetch('metrics?run='+encodeURIComponent(r))).json();
    CFG[r] =await (await fetch('config?run='+encodeURIComponent(r))).json();
  }
  try{ QUEUE=await (await fetch('queue')).json(); }catch(e){ QUEUE=[]; }
  const d=DATA[SEL[0]]||[]; const last=d[d.length-1];
  document.getElementById('status').textContent = last
    ? `${SEL[0]} · update ${last.update} · ${(last.step/1e6).toFixed(2)}M steps · ${(last.time/3600).toFixed(2)} h · ${last.fps.toFixed(0)} fps`
    : 'no metrics yet — start a training run';
  progress(SEL); queue(); kpis(last,d); draw();
}
function best(d,k){return d.length?Math.max(...d.map(x=>x[k]||0)):0}
function eta(run,d){
  const c=CFG[run]||{}, l=d[d.length-1];
  if(!l||!c.total_steps) return null;
  const rt=rate(d), left=Math.max(0,c.total_steps-l.step);
  const byStep = rt>0 ? left/rt/3600 : Infinity;                 // hours
  const byTime = (c.max_hours||Infinity) - l.time/3600;          // wall-clock cap
  const h=Math.min(byStep,byTime);
  return {h, capped:byTime<byStep, pct:100*l.step/c.total_steps,
          step:l.step, total:c.total_steps, rt};
}
function progress(runs){
  // One bar per selected run.  When several are overlaid the bar takes the same
  // colour the run's series has in the charts, so a bar and a curve that belong
  // together look like they do; a lone run keeps the original gradient.
  const el=document.getElementById('prog');
  el.innerHTML = runs.map((r,ri)=>{
    const d=DATA[r]||[], e=eta(r,d), l=d[d.length-1];
    const fill = runs.length>1 ? `;background:var(${COLORS[ri%6]})` : '';
    if(!e) return `<div class="prow">
      <div class="bar"><i style="width:0%${fill}"></i></div>
      <div class="barlab"><span><b>${r}</b>${l?` &nbsp; ${(l.step/1e6).toFixed(2)}M steps`:''}</span>
        <span>${l?'no total_steps in config':'no metrics yet'}</span></div></div>`;
    return `<div class="prow">
      <div class="bar"><i style="width:${Math.min(100,e.pct).toFixed(1)}%${fill}"></i></div>
      <div class="barlab">
        <span><b>${r}</b> &nbsp; ${(e.step/1e6).toFixed(2)}M / ${(e.total/1e6).toFixed(0)}M steps
          &nbsp;·&nbsp; <b>${e.pct.toFixed(1)}%</b></span>
        <span>${(e.rt).toFixed(0)} steps/s &nbsp;·&nbsp; time left
          <b>${hms(e.h)}</b>${e.capped?' (max-hours cap)':''}</span>
      </div></div>`;
  }).join('');
}
function queue(){
  const el=document.getElementById('queue');
  if(!QUEUE.length){el.innerHTML='';return}
  const left=QUEUE.filter(q=>q.state!=='done').length;
  el.innerHTML='<span class="q" style="border:0">pipeline &mdash; '+left+' of '
    +QUEUE.length+' stages left:</span>'
    + QUEUE.map(q=>`<span class="q ${q.state}" title="${q.state}">${q.label}</span>`).join('');
}
function kpis(l,d){
  if(!l){document.getElementById('kpis').innerHTML='';return}
  const K=[['space util',p(l.space_util)],['best util',p(best(d,'space_util'))],
           ['items/bin',f2(l.n_items)],['invalid',p3(l.invalid_rate)],
           ['mask acc',p3(l.mask_acc)],['false-feasible',p3(l.mask_fpr||0)],
           ['steps',(l.step/1e6).toFixed(2)+'M'],
           ['time left',(()=>{const e=eta(SEL[0],d);return e?hms(e.h):'--'})()]];
  document.getElementById('kpis').innerHTML=K.map(([k,v])=>
    `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}
// Centred moving average.  An EMA lags a rising curve by about a full window,
// which at 1200 points spanning 100M steps is ~2.5M steps -- enough to draw the
// first tenth of a run far below where it actually was (index 19 of bpp1_cut2_20
// read 9.6% where the run was at 20.9%).  A centred mean has no phase lag, and
// its window shrinks at both ends so the first and last points stay honest.
function smooth(a,w){
  w=Math.max(1,Math.round(w)); const h=(w-1)>>1, n=a.length;
  const c=new Array(n+1); c[0]=0;
  for(let i=0;i<n;i++) c[i+1]=c[i]+a[i];
  const o=new Array(n);
  for(let i=0;i<n;i++){
    // shrink the half-width symmetrically near the edges: a one-sided window on
    // a steep rise would report the mean of what comes NEXT, so index 0 read
    // 15.8% where the run actually started at 2.1%.  hh=0 at both ends keeps the
    // first and last points exactly as logged, with no phase lag in between.
    const hh=Math.min(h, i, n-1-i);
    o[i]=(c[i+hh+1]-c[i-hh])/(2*hh+1);
  }
  return o;
}
function seriesFor(ci){
  const c=CHARTS[ci], series=[];
  SEL.forEach((r,ri)=>c.k.forEach((k,ki)=>{
    const d=DATA[r]||[]; if(!d.length||d[0][k]===undefined)return;
    const ys=smooth(d.map(x=>x[k]??0), Math.max(2,Math.min(30,d.length/12)));
    series.push({xs:d.map(x=>x.step), ys, c:COLORS[(SEL.length>1?ri:ki)%6],
      n:(SEL.length>1?r+' ':'')+k, raw:d.map(x=>x[k]??0)});
  }));
  return series;
}
// returns {html, X, Y, x0, x1} so the modal can map cursor -> data
function plot(ci,series,W,H,fs,nTicks){
  const c=CHARTS[ci];
  const ml=fs*4.4, mr=fs*0.9, mt=fs*0.8, mb=fs*2.0;
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  series.forEach(s=>{xmin=Math.min(xmin,...s.xs);xmax=Math.max(xmax,...s.xs);
    ymin=Math.min(ymin,...s.ys);ymax=Math.max(ymax,...s.ys)});
  const lg10=c.log&&ymin>0;
  const Yv=v=>lg10?Math.log10(Math.max(v,1e-9)):v;
  let y0=Yv(ymin),y1=Yv(ymax); const pad=(y1-y0||1)*0.12; y0-=pad;y1+=pad;
  const X=v=>ml+(W-ml-mr)*((v-xmin)/((xmax-xmin)||1));
  const Y=v=>mt+(H-mt-mb)*(1-((Yv(v)-y0)/((y1-y0)||1)));
  let out=`<line class="ax" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/>
           <line class="ax" x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}"/>`;
  for(let i=0;i<=nTicks;i++){const t=y0+(y1-y0)*i/nTicks, v=lg10?Math.pow(10,t):t;
    const yy=mt+(H-mt-mb)*(1-i/nTicks);
    out+=`<line class="ax" x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" opacity=".45"/>
          <text class="tk" x="${ml-4}" y="${yy+fs/3}" text-anchor="end"
                style="font-size:${fs}px">${c.fmt(v)}</text>`}
  const nx=Math.min(6,nTicks);
  for(let i=0;i<=nx;i++){const v=xmin+(xmax-xmin)*i/nx;
    out+=`<text class="tk" x="${X(v).toFixed(1)}" y="${H-fs*0.5}" style="font-size:${fs}px"
           text-anchor="${i===0?'start':i===nx?'end':'middle'}">${(v/1e6).toFixed(2)}M</text>`}
  series.forEach(s=>{
    const pts=s.xs.map((x,i)=>`${X(x).toFixed(1)},${Y(s.ys[i]).toFixed(1)}`).join(' ');
    out+=`<polyline fill="none" stroke="var(${s.c})" stroke-width="${fs>10?3.2:1.6}"
           stroke-linejoin="round" points="${pts}"/>`});
  return {html:out, X, Y, xmin, xmax};
}
function draw(){
  const g=document.getElementById('grid');
  if(!g.dataset.built){g.innerHTML=CHARTS.map((c,i)=>
    `<div class="card" onclick="openM(${i})" title="click to enlarge">
       <h2>${c.t}</h2><div class="lg" id="lg${i}"></div>
       <svg id="sv${i}" viewBox="0 0 400 170" preserveAspectRatio="none"></svg></div>`).join('');
    g.dataset.built=1}
  CHARTS.forEach((c,ci)=>{
    const series=seriesFor(ci);
    const sv=document.getElementById('sv'+ci), lg=document.getElementById('lg'+ci);
    if(!series.length){sv.innerHTML='';lg.innerHTML='';return}
    lg.innerHTML=series.map(s=>`<span><i style="background:var(${s.c})"></i>${s.n}
      = ${c.fmt(s.raw[s.raw.length-1])}</span>`).join('');
    sv.innerHTML=plot(ci,series,400,170,9,3).html;
  });
  if(MODAL!==null) renderM();
}

/* ---------- click-to-enlarge ---------- */
let MODAL=null, MGEO=null;
function openM(i){MODAL=i;document.getElementById('modal').hidden=false;renderM();syncURL()}
function closeM(){MODAL=null;document.getElementById('modal').hidden=true;syncURL()}
function stepM(d){if(MODAL===null)return;MODAL=(MODAL+d+CHARTS.length)%CHARTS.length;renderM();syncURL()}
function syncURL(){const q=new URLSearchParams(location.search);
  MODAL===null?q.delete('open'):q.set('open',MODAL);
  history.replaceState(0,'','?'+q.toString());}
function renderM(){
  const c=CHARTS[MODAL], series=seriesFor(MODAL);
  document.getElementById('mtitle').textContent=c.t;
  document.getElementById('mlg').innerHTML=series.map(s=>
    `<span><i style="background:var(${s.c})"></i>${s.n}
      = ${c.fmt(s.raw[s.raw.length-1])}</span>`).join('');
  const sv=document.getElementById('msvg');
  if(!series.length){sv.innerHTML='';return}
  const r=plot(MODAL,series,1000,520,25,6);
  sv.innerHTML=r.html+'<g id="mcross"></g>';
  MGEO={...r, series};
}
document.getElementById('msvg').addEventListener('mousemove',e=>{
  if(!MGEO)return;
  const sv=e.currentTarget, b=sv.getBoundingClientRect();
  // client px -> viewBox units (xMidYMid meet: uniform scale, centred)
  const k=Math.min(b.width/1000,b.height/520);
  const vx=(e.clientX-b.left-(b.width-1000*k)/2)/k;
  const step=MGEO.xmin+(MGEO.xmax-MGEO.xmin)*
    ((vx-MGEO.X(MGEO.xmin))/((MGEO.X(MGEO.xmax)-MGEO.X(MGEO.xmin))||1));
  const c=CHARTS[MODAL]; let g='',read=`<b>${(step/1e6).toFixed(3)}M steps</b> &nbsp; `;
  const px=MGEO.X(Math.max(MGEO.xmin,Math.min(MGEO.xmax,step)));
  g+=`<line x1="${px}" y1="10" x2="${px}" y2="490" stroke="var(--dim)"
       stroke-width="1.6" stroke-dasharray="5 4"/>`;
  MGEO.series.forEach(s=>{
    let j=0,bd=Infinity;
    s.xs.forEach((x,i)=>{const dd=Math.abs(x-step);if(dd<bd){bd=dd;j=i}});
    g+=`<circle cx="${MGEO.X(s.xs[j])}" cy="${MGEO.Y(s.ys[j])}" r="8"
         fill="var(${s.c})" stroke="var(--panel)" stroke-width="3"/>`;
    // the dot sits on the drawn (smoothed) curve, so report that same value --
    // reporting s.raw[j] here is what made the number disagree with the dot
    read+=`<span style="color:var(${s.c})">${s.n}</span> <b>${c.fmt(s.ys[j])}</b> &nbsp; `;
  });
  document.getElementById('mcross').innerHTML=g;
  document.getElementById('mread').innerHTML=read;
});
document.addEventListener('keydown',e=>{
  if(MODAL===null)return;
  if(e.key==='Escape')closeM();
  else if(e.key==='ArrowRight')stepM(1);
  else if(e.key==='ArrowLeft')stepM(-1);
});

boot();
</script>
