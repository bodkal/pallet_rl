<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-BPP training dashboard</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a7;
      --c0:#4cc9f0;--c1:#f7b32b;--c2:#57cc99;--c3:#ef476f;--c4:#b892ff;--c5:#ff9770;}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--fg:#1a1d23;--dim:#6b7280;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;
  user-select:none;font-size:12px;background:var(--panel)}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
main{padding:16px 20px 40px;max-width:1500px;margin:0 auto}
[hidden]{display:none!important}   /* #modal sets display:flex, which would otherwise win */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;flex:1;min-width:120px}
.kpi .v{font-size:20px;font-weight:640;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.card h2{font-size:11px;margin:0 0 6px;font-weight:600;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-bottom:4px;min-height:15px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
svg{width:100%;height:auto;display:block;overflow:visible}
.ax{stroke:var(--line);stroke-width:1}
.tk{fill:var(--dim)}
.bench{stroke:var(--c1);stroke-width:1.4;stroke-dasharray:5 4}
#ms{cursor:crosshair}
#mcross{pointer-events:none}   /* the dots must not steal the svg's mousemove */
#mread{font-size:14px;color:var(--dim);min-height:22px;padding-top:9px;
  font-variant-numeric:tabular-nums;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
#mread b{color:var(--fg);font-weight:640}
#mread i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
#mhint{color:var(--dim);font-size:11px;opacity:.75;padding-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;
  align-items:center;justify-content:center;padding:26px}
#modal .card{width:min(1100px,96vw);cursor:default}
table.sum{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.sum th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;padding:0 10px 6px 0}
table.sum td{padding:4px 10px 4px 0;border-top:1px solid var(--line)}
.good{color:var(--c2);font-weight:640}
.bad{color:var(--c3)}
</style>

<header>
  <h1>3D-BPP training</h1>
  <span class="sub" id="hs">arXiv:2208.07123 &mdash; online 3D bin packing with a buffer</span>
  <span class="spacer"></span>
  <div class="row" id="runs" style="display:flex;gap:7px;flex-wrap:wrap"></div>
</header>

<main>
  <div class="kpis" id="kpis"></div>
  <div class="card" id="sumcard" style="margin-bottom:14px;cursor:default" hidden>
    <h2>Final evaluation vs. the paper</h2>
    <div id="sum"></div>
  </div>
  <div id="grid"></div>
</main>

<div id="modal" hidden onclick="closeM()">
  <div class="card" onclick="event.stopPropagation()">
    <h2 id="mt"></h2><div class="lg" id="ml"></div>
    <svg id="ms" viewBox="0 0 900 420" preserveAspectRatio="none"></svg>
    <div id="mread"></div>
    <div id="mhint">hover to read every series at one x &nbsp;&middot;&nbsp;
      &larr; &rarr; to move between plots &nbsp;&middot;&nbsp;
      esc or click outside to close &nbsp;&middot;&nbsp; updates live</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const COLORS = ['--c0','--c2','--c1','--c4','--c3','--c5'];
let RUNS=[], SEL=[], DATA={}, SUMMARY={}, MODAL=null;
const NICE = {cut1:'CUT-1', cut2:'CUT-2', rs:'RS'};
const nice = d => NICE[d] || d;

const pc = v => v.toFixed(1)+'%';
const f2 = v => v.toFixed(2);
const f3 = v => v.toFixed(3);
const f0 = v => v.toFixed(0);

/* every chart: title, the log keys it draws, a formatter, and whether the
   paper's benchmark for the selected run belongs on it */
const CHARTS = [
  {t:'space utilisation — self-play vs. its own baseline', k:['sp_util','base_util'], fmt:pc, bench:'util'},
  {t:'held-out evaluation — MCTS vs. policy only',         k:['mcts_util','greedy_util'], fmt:pc, bench:'util'},
  {t:'items packed (held-out)',                            k:['mcts_items'], fmt:f2, bench:'items'},
  {t:'policy loss',                                        k:['pol_loss'], fmt:f3},
  {t:'value loss',                                         k:['val_loss'], fmt:f3},
  {t:'episodes kept by the filter (of 512)',               k:['kept'], fmt:f0},
  {t:'replay buffer',                                      k:['n_replay'], fmt:f0},
  {t:'self-play seconds per iteration',                    k:['t_sp'], fmt:f0},
  {t:'learning rate',                                      k:['lr'], fmt:v=>v.toExponential(1), log:true},
];

async function boot(){
  RUNS = await (await fetch('/runs')).json();
  SUMMARY = await (await fetch('/summary')).json();
  SEL = RUNS.filter(r=>r.iters).slice(0,3).map(r=>r.run);
  if(!SEL.length && RUNS.length) SEL=[RUNS[0].run];
  renderRuns(); renderSummary(); await tick();
  setInterval(tick, 5000);
}
function renderRuns(){
  $('#runs').innerHTML = RUNS.map(r=>
    `<span class="pill${SEL.includes(r.run)?' on':''}" data-r="${r.run}"
      title="${r.data} · b=${r.b} k=${r.k} · ${r.games} games/iter · ${r.sims} sims">${r.run}</span>`).join('');
  $('#runs').querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
    const r=p.dataset.r;
    SEL = SEL.includes(r) ? SEL.filter(x=>x!==r) : SEL.concat([r]);
    if(!SEL.length) SEL=[r];
    renderRuns(); tick();
  });
}
async function tick(){
  await Promise.all(SEL.map(async r=>{ DATA[r] = await (await fetch('/log?run='+encodeURIComponent(r))).json(); }));
  kpis(); draw();
}
function meta(run){ return RUNS.find(r=>r.run===run) || {}; }
function last(run){ const d=DATA[run]||[]; return d.length?d[d.length-1]:{}; }

function kpis(){
  const r = SEL[0], m = meta(r), d = last(r), rows = DATA[r]||[];
  if(!rows.length){ $('#kpis').innerHTML=''; return; }
  const eta = m.iters && d.it ? (d.mins/(d.it+1))*(m.iters-d.it-1) : 0;
  const bestEval = Math.max(...rows.map(x=>x.mcts_util||0));
  const cells = [
    ['run', r], [`stream · b=${m.b} k=${m.k}`, nice(m.data)],
    ['iteration', `${(d.it||0)+1} / ${m.iters||'?'}`],
    ['episodes', ((d.ep||0)/1000).toFixed(1)+'k'],
    ['self-play util', pc(d.sp_util||0)],
    ['best held-out MCTS', bestEval ? pc(bestEval) : '—'],
    ['paper target', m.bench_util ? pc(m.bench_util) : '—'],
    ['elapsed', `${(d.mins||0).toFixed(0)} min`],
    ['eta', eta>0 ? `${eta.toFixed(0)} min` : 'done'],
  ];
  $('#kpis').innerHTML = cells.map(([k,v])=>
    `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}
function renderSummary(){
  const rows = Array.isArray(SUMMARY) ? SUMMARY : (SUMMARY.rows || []);
  if(!rows.length) return;
  $('#sumcard').hidden = false;
  $('#sum').innerHTML = `<table class="sum"><tr><th>dataset</th><th>b</th><th>k</th>
    <th>paper</th><th>this run</th><th>policy only</th><th>% of paper</th></tr>`
    + rows.map(r=>`<tr><td>${nice(r.data)}</td><td>${r.b}</td><td>${r.k}</td>
      <td>${r.bench_items?.toFixed(1) ?? '—'} / ${r.bench_util?.toFixed(1) ?? '—'}%</td>
      <td><b>${r.mcts_items.toFixed(2)} / ${r.mcts_util.toFixed(1)}%</b></td>
      <td>${r.greedy_util.toFixed(1)}%</td>
      <td class="${r.pct_of_bench>=100?'good':'bad'}">${r.pct_of_bench?.toFixed(0) ?? '—'}%</td></tr>`).join('')
    + '</table>';
}

/* ---------- plotting ---------- */
function seriesFor(ci){
  const c=CHARTS[ci], out=[];
  SEL.forEach((r,ri)=>c.k.forEach((k,ki)=>{
    const d=DATA[r]||[];
    const pts=d.filter(x=>x[k]!==undefined && x[k]!==null);
    if(!pts.length) return;
    out.push({xs:pts.map(x=>x.ep), ys:pts.map(x=>x[k]), its:pts.map(x=>x.it),
              c:COLORS[(SEL.length>1?ri*c.k.length+ki:ki)%6],
              n:(SEL.length>1?r+' ':'')+k});
  }));
  return out;
}
/* the paper's number for the selected runs, so the target is on the chart */
function benchFor(ci){
  const c=CHARTS[ci];
  if(!c.bench) return [];
  const seen=new Set(), out=[];
  SEL.forEach(r=>{ const m=meta(r);
    const v = c.bench==='util' ? m.bench_util : m.bench_items;
    if(v && !seen.has(v)){ seen.add(v); out.push({v, n:`paper ${m.data} = ${c.fmt(v)}`}); }});
  return out;
}
function plot(ci, series, W, H, fs, nTicks){
  const c=CHARTS[ci], bench=benchFor(ci);
  const ml=fs*4.6, mr=fs*0.9, mt=fs*0.8, mb=fs*2.2;
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  series.forEach(s=>{ xmin=Math.min(xmin,...s.xs); xmax=Math.max(xmax,...s.xs);
                      ymin=Math.min(ymin,...s.ys); ymax=Math.max(ymax,...s.ys); });
  bench.forEach(b=>{ ymin=Math.min(ymin,b.v); ymax=Math.max(ymax,b.v); });
  const lg10=c.log&&ymin>0;
  const Yv=v=>lg10?Math.log10(Math.max(v,1e-12)):v;
  let y0=Yv(ymin), y1=Yv(ymax); const pad=(y1-y0||1)*0.12; y0-=pad; y1+=pad;
  const X=v=>ml+(W-ml-mr)*((v-xmin)/((xmax-xmin)||1));
  const Y=v=>mt+(H-mt-mb)*(1-((Yv(v)-y0)/((y1-y0)||1)));
  let out=`<line class="ax" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/>
           <line class="ax" x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}"/>`;
  for(let i=0;i<=nTicks;i++){
    const t=y0+(y1-y0)*i/nTicks, v=lg10?Math.pow(10,t):t;
    const yy=mt+(H-mt-mb)*(1-i/nTicks);
    out+=`<line class="ax" x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" opacity=".45"/>
          <text class="tk" x="${ml-4}" y="${yy+fs/3}" text-anchor="end"
                style="font-size:${fs}px">${c.fmt(v)}</text>`;
  }
  const nx=Math.min(6,nTicks+3);
  for(let i=0;i<=nx;i++){ const v=xmin+(xmax-xmin)*i/nx;
    out+=`<text class="tk" x="${X(v).toFixed(1)}" y="${H-fs*0.6}" style="font-size:${fs}px"
           text-anchor="${i===0?'start':i===nx?'end':'middle'}">${(v/1000).toFixed(0)}k</text>`; }
  bench.forEach(b=>{ const yy=Y(b.v);
    out+=`<line class="bench" x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}"/>`; });
  series.forEach(s=>{
    const pts=s.xs.map((x,i)=>`${X(x).toFixed(1)},${Y(s.ys[i]).toFixed(1)}`).join(' ');
    out+=`<polyline fill="none" stroke="var(${s.c})" stroke-width="${fs>10?2.6:1.6}"
           stroke-linejoin="round" points="${pts}"/>`; });
  return {html:out, X, Y, xmin, xmax, ml, mr, mt, mb, W, H};
}
function legend(ci, series){
  return series.map(s=>`<span><i style="background:var(${s.c})"></i>${s.n}</span>`).join('')
    + benchFor(ci).map(b=>`<span><i style="background:var(--c1);opacity:.7"></i>${b.n}</span>`).join('');
}
function draw(){
  const g=$('#grid');
  if(!g.dataset.built){
    g.innerHTML = CHARTS.map((c,i)=>
      `<div class="card" onclick="openM(${i})" title="click to enlarge">
         <h2>${c.t}</h2><div class="lg" id="lg${i}"></div>
         <svg id="sv${i}" viewBox="0 0 420 180" preserveAspectRatio="none"></svg></div>`).join('');
    g.dataset.built = 1;
  }
  CHARTS.forEach((c,ci)=>{
    const s=seriesFor(ci);
    $('#sv'+ci).innerHTML = s.length ? plot(ci,s,420,180,9,3).html : '';
    $('#lg'+ci).innerHTML = s.length ? legend(ci,s) : '<span>no data yet</span>';
  });
  if(MODAL!==null) renderM();
}
let MGEO=null, MX=null;          /* plot geometry, and the cursor in viewBox units */
function openM(i){ MODAL=i; MX=null; $('#modal').hidden=false; renderM(); }
function closeM(){ MODAL=null; MX=null; MGEO=null; $('#modal').hidden=true; }
function stepM(d){ if(MODAL===null) return; MODAL=(MODAL+d+CHARTS.length)%CHARTS.length; renderM(); }
function renderM(){
  const s=seriesFor(MODAL);
  $('#mt').textContent = CHARTS[MODAL].t + '  —  x axis: self-play episodes';
  $('#ml').innerHTML = legend(MODAL, s);
  if(!s.length){ $('#ms').innerHTML=''; $('#mread').innerHTML=''; MGEO=null; return; }
  const r = plot(MODAL,s,900,420,13,6);
  $('#ms').innerHTML = r.html + '<g id="mcross"></g>';
  MGEO = {...r, series:s};
  /* a live tick redraws this plot every 5 s - put the crosshair back where the
     cursor left it instead of making the reader chase it */
  if(MX!==null) crossAt(MX); else $('#mread').innerHTML='';
}
/* vertical rule at the hovered x, a dot on every series at its nearest sample,
   and the values spelled out underneath */
function crossAt(vx){
  if(!MGEO) return;
  const g=MGEO, c=CHARTS[MODAL];
  const x0=g.X(g.xmin), x1=g.X(g.xmax);
  const ep = g.xmin + (g.xmax-g.xmin)*((Math.max(x0,Math.min(x1,vx))-x0)/((x1-x0)||1));
  const px = g.X(ep);
  let marks=`<line x1="${px.toFixed(1)}" y1="${g.mt}" x2="${px.toFixed(1)}" y2="${g.H-g.mb}"
              stroke="var(--dim)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  let read='', it=null;
  g.series.forEach(s=>{
    let j=0, bd=Infinity;
    s.xs.forEach((x,i)=>{ const d=Math.abs(x-ep); if(d<bd){ bd=d; j=i; } });
    if(it===null) it=s.its[j];
    marks+=`<circle cx="${g.X(s.xs[j]).toFixed(1)}" cy="${g.Y(s.ys[j]).toFixed(1)}" r="5.5"
             fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>`;
    read+=`<span><i style="background:var(${s.c})"></i>${s.n} <b>${c.fmt(s.ys[j])}</b></span>`;
  });
  $('#mcross').innerHTML = marks;
  $('#mread').innerHTML =
    `<span><b>iter ${it ?? '—'}</b> &middot; ${(ep/1000).toFixed(1)}k episodes</span>` + read;
}
$('#ms').addEventListener('mousemove', e=>{
  const b=e.currentTarget.getBoundingClientRect();
  if(!b.width) return;
  MX=(e.clientX-b.left)*900/b.width;   /* client px -> viewBox units; preserveAspectRatio="none", so a plain linear scale */
  crossAt(MX);
});
$('#ms').addEventListener('mouseleave', ()=>{
  MX=null;
  const g=$('#mcross'); if(g) g.innerHTML='';
  $('#mread').innerHTML='';
});
window.addEventListener('keydown', e=>{
  if(MODAL===null) return;
  if(e.key==='Escape') closeM();
  else if(e.key==='ArrowRight') stepM(1);
  else if(e.key==='ArrowLeft') stepM(-1);
});
boot();
</script>
